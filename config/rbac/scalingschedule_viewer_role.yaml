# This rule is not used by the project platform-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to platform.example.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: platform-operator
    app.kubernetes.io/managed-by: kustomize
  name: scalingschedule-viewer-role
rules:
- apiGroups:
  - platform.example.com
  resources:
  - scalingschedules
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - platform.example.com
  resources:
  - scalingschedules/status
  verbs:
  - get
