---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.example.com
  resources:
  - scalingschedules
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - platform.example.com
  resources:
  - scalingschedules/status
  - webapps/scale
  - webapps/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - platform.example.com
  resources:
  - webapps
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.example.com
  resources:
  - webapps/finalizers
  verbs:
  - update
