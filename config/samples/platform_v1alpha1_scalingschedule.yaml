# Scale the storefront up for business hours and down overnight.
#   kubectl get scalingschedules        (or: kubectl get ss)
#   kubectl describe scalingschedule storefront-hours
#
# Tip: to see it act right away, change a window so that it covers the
# current time in your time zone, then `kubectl apply -k config/samples/`.
apiVersion: platform.example.com/v1alpha1
kind: ScalingSchedule
metadata:
  labels:
    app.kubernetes.io/name: platform-operator
    app.kubernetes.io/managed-by: kustomize
  name: storefront-hours
spec:
  targetRef:
    name: storefront
  timeZone: Europe/London
  # Used whenever no window is active.
  defaultReplicas: 2
  # First matching window wins.
  windows:
  - name: business-hours
    days: [Mon, Tue, Wed, Thu, Fri]
    start: "08:00"
    end: "18:00"
    replicas: 4
  - name: overnight-quiet
    # end < start, so this window crosses midnight: 23:00 -> 06:00.
    start: "23:00"
    end: "06:00"
    replicas: 1
